<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9D42" />
      <stop offset="50%" stop-color="#FD6F00" />
      <stop offset="100%" stop-color="#E05900" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="#0D0E11" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#brandGradient)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Monogram Logo 'AR' -->
  <g filter="url(#glow)">
    <!-- Stylized 'A' shape -->
    <path d="M 170 370 L 256 150 L 342 370" fill="none" stroke="url(#brandGradient)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 202 290 L 310 290" fill="none" stroke="url(#brandGradient)" stroke-width="32" stroke-linecap="round" />
    
    <!-- Accent Sparkle / UX Dot -->
    <circle cx="342" cy="150" r="24" fill="#FF9D42" />
  </g>
</svg>
